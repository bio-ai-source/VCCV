eta_grid: [0.2, 0.5, 1.0, 2.0, 4.0]
kcand_dti: 40
kcand_expr: 30
lambda_map: 0.5
null_num_prototypes: 3
decision:
  gap_threshold: 0.42
  deep_near_tie_threshold: 0.05
  strong_null_threshold: 0.95
poly:
  k_poly: 20
  epsilon: 1.0e-4
  alpha0: 0.4
  kappa: 0.7
  max_iters: 120
  lr: 0.06
  hess_eps: 1.0e-3
  min_eig: 1.0e-4
  damping: 1.0e-3
  # A poly hypothesis must retain at least two substantive contributors.
  # The 0.15 floor matches the minimum two-target weight generated by the
  # current semi-synthetic mechanism audit (uniform draws on [0.2, 1.0]).
  min_second_weight: 0.15
  # Screen by single-anchor energy, then optimize one simplex on this active set.
  # This is not pair enumeration; it prevents 20-dimensional boundary collapse.
  active_set_size: 4
